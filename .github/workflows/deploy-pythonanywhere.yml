name: Deploy to PythonAnywhere (recursive upload)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: pythonanywhere-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_TOKEN: ${{ secrets.PA_TOKEN }}
          PA_TARGET_DIR: ${{ secrets.PA_TARGET_DIR }}
          PA_WEBAPP_DOMAIN: ${{ secrets.PA_WEBAPP_DOMAIN }}
        run: |
          set -euo pipefail
          test -n "$PA_USERNAME" || { echo "Secret PA_USERNAME absent"; exit 1; }
          test -n "$PA_TOKEN" || { echo "Secret PA_TOKEN absent"; exit 1; }
          test -n "$PA_TARGET_DIR" || { echo "Secret PA_TARGET_DIR absent"; exit 1; }
          test -n "$PA_WEBAPP_DOMAIN" || { echo "Secret PA_WEBAPP_DOMAIN absent"; exit 1; }

      - name: Upload files with rate-limit retry
        shell: bash
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_TOKEN: ${{ secrets.PA_TOKEN }}
          PA_TARGET_DIR: ${{ secrets.PA_TARGET_DIR }}
          PA_WEBAPP_DOMAIN: ${{ secrets.PA_WEBAPP_DOMAIN }}
          PA_HOST: ${{ secrets.PA_HOST }}
        run: |
          set -euo pipefail
          HOST="${PA_HOST:-www.pythonanywhere.com}"
          echo "Using PythonAnywhere host: ${HOST}"
          echo "Target directory: ${PA_TARGET_DIR}"

          upload_file() {
            local file="$1"
            local destination="$2"
            local attempt=1
            local max_attempts=5
            while (( attempt <= max_attempts )); do
              local status
              status=$(curl -sS -o /tmp/pa_response.txt -w "%{http_code}" -X POST \
                -H "Authorization: Token ${PA_TOKEN}" \
                -F "content=@${file}" \
                "https://${HOST}/api/v0/user/${PA_USERNAME}/files/path${destination}" || true)
              if [[ "$status" =~ ^2 ]]; then
                return 0
              fi
              if [[ "$status" == "429" || "$status" =~ ^5 ]]; then
                local wait_seconds=$((attempt * 3))
                echo "Temporary HTTP ${status} for ${destination}; retry ${attempt}/${max_attempts} in ${wait_seconds}s"
                sleep "$wait_seconds"
                ((attempt+=1))
                continue
              fi
              echo "Upload failed for ${destination}: HTTP ${status}"
              cat /tmp/pa_response.txt || true
              return 1
            done
            echo "Upload stopped after ${max_attempts} attempts: ${destination}"
            cat /tmp/pa_response.txt || true
            return 1
          }

          while IFS= read -r -d '' file; do
            rel="${file#./}"
            case "$rel" in
              .git/*|.github/*|.venv/*|__pycache__/*|node_modules/*) continue ;;
              *.pyc|.DS_Store) continue ;;
            esac
            remote_path="${PA_TARGET_DIR}/${rel}"
            echo "Uploading ${rel}"
            upload_file "$file" "$remote_path"
            # Limite la fréquence des appels à l'API Files.
            sleep 1
          done < <(
            find . \
              -type d \( -name .git -o -name .github -o -name .venv -o -name __pycache__ -o -name node_modules \) -prune -false \
              -o -type f ! -name ".DS_Store" ! -name "*.pyc" -print0
          )

          echo "Reloading webapp ${PA_WEBAPP_DOMAIN}..."
          status=$(curl -sS -o /tmp/pa_reload.txt -w "%{http_code}" -X POST \
            -H "Authorization: Token ${PA_TOKEN}" \
            "https://${HOST}/api/v0/user/${PA_USERNAME}/webapps/${PA_WEBAPP_DOMAIN}/reload/" || true)
          if [[ ! "$status" =~ ^2 ]]; then
            echo "Reload failed: HTTP ${status}"
            cat /tmp/pa_reload.txt || true
            exit 1
          fi
          echo "Deployed. Try: https://${PA_WEBAPP_DOMAIN}/"
