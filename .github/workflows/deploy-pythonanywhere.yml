name: Deploy to PythonAnywhere (manual only)

# Deployment is manual until a separate target web app/path has been confirmed.
# This prevents pushes from attempting to overwrite the first workshop's site.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_TOKEN: ${{ secrets.PA_TOKEN }}
          PA_TARGET_DIR: ${{ secrets.PA_TARGET_DIR }}
          PA_WEBAPP_DOMAIN: ${{ secrets.PA_WEBAPP_DOMAIN }}
          PA_HOST: ${{ secrets.PA_HOST }}
        run: |
          set -euo pipefail
          missing=0
          for name in PA_USERNAME PA_TOKEN PA_TARGET_DIR PA_WEBAPP_DOMAIN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret ${name} is missing. Configure it in Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          # Until a distinct deployment target is verified, do not upload or reload anything.
          if [[ "${PA_WEBAPP_DOMAIN}" == "alleamar5.pythonanywhere.com" ]]; then
            echo "::error::Deployment stopped to protect your first workshop site. Confirm a separate target before enabling deployment."
            exit 1
          fi

          if [[ "${PA_TARGET_DIR}" == "/" || "${PA_TARGET_DIR}" == "/home/${PA_USERNAME}" ]]; then
            echo "::error::PA_TARGET_DIR is too broad; choose a dedicated project directory."
            exit 1
          fi

          echo "Configuration checks passed. No upload occurs until this manual workflow is run with a verified separate target."
